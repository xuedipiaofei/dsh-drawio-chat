name: Deploy template gallery to GitHub Pages

# Static draw.io template gallery: the build step assembles `site/` + `templates/`
# into `site-dist/`, which is deployed as a Pages artifact. Enable Pages in
# repository settings with "GitHub Actions" as the source once before the first
# deployment.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deployment finish instead of cancelling it, but never run two
# deployments at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site-dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site
        run: node scripts/build-site.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
